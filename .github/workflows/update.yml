name: Update proxy list

# Normal updates are pushed every minute from the SOLProxy server.
# This workflow is only a manual fallback ("Run workflow" button).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-proxy-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the verified list from solproxy.net
        run: python scripts/update.py
      - name: Commit and push
        run: |
          git config user.name "solproxy-bot"
          git config user.email "info@solproxy.net"
          git add -A
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Update proxy list $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
